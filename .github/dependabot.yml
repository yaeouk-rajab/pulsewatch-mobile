version: 2
updates:
  # Expo app dependencies (root package.json)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Expo packages move together with the SDK (57); upgrade the SDK deliberately.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      # jest-expo and eslint-config-expo are versioned with the SDK too: jest-expo 58
      # needs that SDK's react-native and fails the test suites on an older one.
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]
      # react, react-native and their types/presets are chosen by the Expo
      # SDK too, and in 0.x/19.x a minor bump is a breaking change. Patch
      # updates still come through; move these with an SDK upgrade.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The lint toolchain pulled in by eslint-config-expo (typescript-eslint,
      # eslint-plugin-react) does not load under TypeScript 7 or ESLint 10 yet:
      # lint crashes in ts-api-utils / eslint-plugin-react. Revisit when
      # eslint-config-expo supports them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
