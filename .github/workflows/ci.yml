name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: typecheck
        run: npm run typecheck

      - name: eslint
        run: npm run lint

      - name: test
        run: npm test -- --ci

      # Metro bundle for both native platforms. typecheck, lint and Jest all
      # passed on a Dependabot PR (#27) that moved expo-router to SDK 58 while
      # the app was on SDK 57, but the bundle could not resolve
      # react-native/setup-env. EXPO_OFFLINE skips the Expo API version check.
      - name: bundle (expo export)
        run: npx expo export --platform android --platform ios --output-dir dist
        env:
          EXPO_OFFLINE: "1"

      # --audit-level=high: at SDK 58, `expo`'s own build/CLI tooling
      # (@expo/cli and friends — never shipped in the app bundle) pulls in a
      # zod advisory with no fix available yet (see README), covered by a
      # dated allowlist in scripts/check-npm-audit.mjs. Any other high/critical
      # finding still fails the build.
      #
      # scripts/check-npm-audit.mjs wraps the raw `npm audit` check with a
      # small, dated allowlist for one specific high-severity finding
      # (node-forge / GHSA-86w9-cpqp-85rv, also dev-tooling-only — see the
      # script's own header and README's "Known issues") that has no
      # upstream fix yet. Any OTHER high/critical finding still fails this
      # step immediately, and the allowlist entry itself expires on a set
      # date so it can't silently become permanent.
      - name: npm audit
        run: node scripts/check-npm-audit.mjs

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # CodeQL for this repo's own GitHub Actions workflows (injection via
  # untrusted event data, over-broad token permissions, unsafe checkouts).
  # A separate job so the existing CodeQL job and its required check name
  # stay unchanged; GitHub's required `CodeQL` check gates its alerts too.
  codeql-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
